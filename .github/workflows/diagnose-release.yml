name: Repair v1.3.0 release notes
on:
  push:
    branches: ['diagnostics/v1.2.0-release']
permissions:
  contents: write
jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore notes from the unchanged annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git for-each-ref --format='%(contents)' refs/tags/v1.3.0 > release-notes.md
          test -s release-notes.md
          gh release edit v1.3.0 --notes-file release-notes.md
